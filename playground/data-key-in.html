<!DOCTYPE html>

  <head>
		<!-- Fonts: one consolidated request listing only the weights the
		     site uses. preconnect warms the gstatic origin so the font
		     files start as soon as the CSS arrives. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400;1,400&family=Caveat:wght@400;700&family=Lato:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet" />
		<!-- Shared sheets linked directly so they download in parallel
		     rather than queueing behind style.css's nested @imports.
		     Order mirrors the old depth-first import order; the @imports
		     stay in the sheets and identical URLs are deduped. -->
		<link href="../styles/site-typography.css" rel="stylesheet" />
		<link href="../styles/site-footer.css" rel="stylesheet" />
		<link href="../styles/site-navigation.css" rel="stylesheet" />
		<link href="../styles/site-motion.css" rel="stylesheet" />
		<link href="../styles/site-header.css" rel="stylesheet" />
    <link href="../styles/style.css" type="text/css" rel="stylesheet">
    <link href="./data-key-in.css" type="text/css" rel="stylesheet">

    <title>Terrance's Homepage</title>
      <!-- Vercel Analytics -->

      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

    <content>
      <form>
        <h1>Food Details Key-In</h1>
        <label for="username">Food Name</label>
        <input type="text" name="foodname" id="foodname" required>
        <br>
        <label for="password">Restaurant Name</label>
        <input type="text" name="restaurantname" id="restaurantname" required>
        <br>
        <label for="restaurantdescription" class="longkeyin">Restaurant Description</label>
        <input type="text" name="restaurantdescription" id="restaurantdescription" required>
        <br>
        <label for="price">Price</label>
        <input type="range" min="1" max="5" step="1">
        <br>
        <label for="address" class="longkeyin">Address</label>
        <input type="text" name="address" id="address">
        <br>
        <label for="phonenumber">Phone Number</label>
        <input type="text" name="phonenumber" id="phonenumber">
        <br>
        <label for="googlemapnav" class="longkeyin">Google Map Navigation Link</label>
        <input type="text" name="googlemapnav" id="googlemapnav">
        <br>
        <input id="submit" type="submit" value="Submit">
      </form>
    </content>

    </footer>

  </body>

</html>
