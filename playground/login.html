<!DOCTYPE html>

  <head>
		<!-- Fonts: one consolidated request listing only the weights the
		     site uses. preconnect warms the gstatic origin so the font
		     files start as soon as the CSS arrives. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400;1,400&family=Caveat:wght@400;700&family=Lato:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet" />
		<!-- Shared sheets linked directly so they download in parallel
		     rather than queueing behind style.css's nested @imports.
		     Order mirrors the old depth-first import order; the @imports
		     stay in the sheets and identical URLs are deduped. -->
		<link href="/styles/site-typography.css" rel="stylesheet" />
		<link href="/styles/site-footer.css" rel="stylesheet" />
		<link href="/styles/site-navigation.css" rel="stylesheet" />
		<link href="/styles/site-motion.css" rel="stylesheet" />
		<link href="/styles/site-header.css" rel="stylesheet" />
    <link href="./login.css" type="text/css" rel="stylesheet">
    <!-- Footer-only stylesheet for the footer.js-injected footer -->
    <link href="/styles/site-footer.css" type="text/css" rel="stylesheet">
    <!-- Shared header stylesheet (this page doesn't load styles/style.css;
         site-header.css itself imports the shared nav sheet) -->
    <link href="/styles/site-header.css" type="text/css" rel="stylesheet">

    <title>Terrance's Homepage</title>
      <!-- Vercel Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

  <body>

    <header class="site-header">
      <div class="site-header-inner">
        <div class="site-header-brand">
          <h1 class="site-header-title">Terrance's Playground</h1>
        </div>
        <nav class="site-nav">
          <a href="/">Home</a>
          <a href="/articles.html">Articles</a>
          <a href="/projects.html">Projects</a>
          <a href="/playground.html" aria-current="location">Playground</a>
        </nav>
        <div class="site-social-links">
          <a class="site-social-link" href="https://facebook.com/terrancehah/" target="_blank"><img src="/resources/optimized/icons/facebook-png-128.webp" alt="facebook" class="site-social-icon"></a>
          <a class="site-social-link" href="https://instagram.com/terrancehah/" target="_blank"><img src="/resources/optimized/icons/instagram-png-128.webp" alt="instagram" class="site-social-icon"></a>
          <a class="site-social-link" href="https://www.linkedin.com/in/terrancehah/" target="_blank"><img src="/resources/optimized/icons/linkedin-png-128.webp" alt="linkedin" class="site-social-icon"></a>
          <a class="site-social-link" href="https://github.com/terrancehah" target="_blank"><img src="/resources/optimized/icons/github-png-128.webp" alt="github" class="site-social-icon"></a>
        </div>
      </div>
    </header>
    
    <content>
      <form>
        <h1>Login</h1>
        <label for="username">Username</label><br>
        <input type="text" name="username" id="username" required>
        <br>
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password" required>
        <br>
        <br>
        <input id="submit" type="submit" value="Submit">
      </form>
    </content>

    <!-- Shared footer + back-to-top -->
    <script src="/js/footer.js"></script>

  </body>

</html>
