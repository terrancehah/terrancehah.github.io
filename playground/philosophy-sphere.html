<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philosophy Sphere - Interactive Ideology Explorer</title>
    
    <!-- Stylesheets -->
		<!-- Fonts: one consolidated request listing only the weights the
		     site uses. preconnect warms the gstatic origin so the font
		     files start as soon as the CSS arrives. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400;1,400&family=Caveat:wght@400;700&family=Lato:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet" />
		<!-- Shared sheets linked directly so they download in parallel
		     rather than queueing behind style.css's nested @imports.
		     Order mirrors the old depth-first import order; the @imports
		     stay in the sheets and identical URLs are deduped. -->
		<link href="../styles/site-typography.css" rel="stylesheet" />
		<link href="../styles/site-footer.css" rel="stylesheet" />
		<link href="../styles/site-navigation.css" rel="stylesheet" />
		<link href="../styles/site-motion.css" rel="stylesheet" />
		<link href="../styles/site-header.css" rel="stylesheet" />
    <link href="../styles/output.css" rel="stylesheet">
    <link href="../styles/style.css" type="text/css" rel="stylesheet">
    <link href="philosophy-sphere.css" type="text/css" rel="stylesheet">
    <link rel="icon" href="../resources/icons/TH-logo.png" type="image/x-icon">
    
    <!-- Meta tags -->
    <meta property="og:title" content="Philosophy Sphere - Interactive Ideology Explorer">
    <meta property="og:description" content="Explore philosophical ideologies and their relationships in an interactive 3D visualization">
    <meta property="og:image" content="https://terrancehah.com/resources/icons/TH-logo.png">
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://terrancehah.com/playground/philosophy-sphere.html">
    
    <!-- External libraries for 2D visualization -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Footer script -->
    <script src="../js/footer.js" defer></script>
    
    
    <!-- Vercel Analytics (only loads on production) -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js" onerror="console.log('Vercel Analytics not available (local dev)')"></script>
</head>

<body class="m-0 relative h-full bg-white overflow-x-hidden">
    <!-- Header with navigation -->
    <header class="site-header">
        <div class="site-header-inner">
            
            <!-- Left: Logo & Title -->
            <div class="site-header-brand">
                <h1 class="site-header-title">
                    Terrance's Playground
                </h1>
            </div>

            <!-- Middle: Nav buttons -->
            <nav class="site-nav">
                <a href="/">Home</a>
                <a href="../articles.html">Articles</a>
                <a href="../projects.html">Projects</a>
                <a href="../playground.html" aria-current="location">Playground</a>
            </nav>
        
            <!-- Right side: Social Icons -->
            <div class="site-social-links">
                <a href="https://facebook.com/terrancehah/" target="_blank" class="site-social-link">
                    <img src="/resources/optimized/icons/facebook-png-128.webp" alt="facebook" class="site-social-icon">
                </a>
                <a href="https://instagram.com/terrancehah/" target="_blank" class="site-social-link">
                    <img src="/resources/optimized/icons/instagram-png-128.webp" alt="instagram" class="site-social-icon">
                </a>
                <a href="https://x.com/terrance_hah" target="_blank" class="site-social-link">
                    <img src="/resources/optimized/icons/x-png-128.webp" alt="x" class="site-social-icon">
                </a>
                <a href="https://www.linkedin.com/in/terrancehah/" target="_blank" class="site-social-link">
                    <img src="/resources/optimized/icons/linkedin-png-128.webp" alt="linkedin" class="site-social-icon">
                </a>
                <a href="https://github.com/terrancehah" target="_blank" class="site-social-link">
                    <img src="/resources/optimized/icons/github-png-128.webp" alt="github" class="site-social-icon">
                </a>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="philosophy-sphere-container">
        <!-- Controls section -->
        <div class="controls-section">
            <div class="autocomplete-wrapper">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search philosophies, concepts, or philosophers..." 
                    class="search-input"
                    autocomplete="off"
                />
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>
            <button id="language-toggle" class="language-toggle" title="Switch Language">
                <span class="lang-en">中文</span>
                <span class="lang-zh" style="display: none;">EN</span>
            </button>
        </div>

        <!-- Legend (mobile only - outside map) -->
        <div class="legend-mobile">
            <h3 class="legend-title" data-en="Legend" data-zh="图例">Legend</h3>
            <div class="legend-items-mobile">
                <div class="legend-item">
                    <span class="legend-color ideology-color" data-en="Ideology" data-zh="哲学流派">Ideology</span>
                    <span data-en="Major school" data-zh="主要学派">Major school</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color keyword-color" data-en="Concept" data-zh="概念">Concept</span>
                    <span data-en="Related idea" data-zh="相关思想">Related idea</span>
                </div>
                <div class="legend-item">
                    <span class="legend-line influence-line"></span>
                    <span data-en="Influence" data-zh="影响">Influence</span>
                </div>
                <div class="legend-item">
                    <span class="legend-line opposition-line"></span>
                    <span data-en="Opposition" data-zh="对立">Opposition</span>
                </div>
            </div>
        </div>

        <!-- Layout: Info sidebar on left, graph on right -->
        <div class="visualization-layout">
            <!-- Info sidebar (desktop) -->
            <div id="info-sidebar" class="info-sidebar hidden">
                <button id="close-info" class="close-sidebar-button">×</button>
                <div class="info-content">
                    <h3 id="node-title" class="node-title"></h3>
                    <p id="node-philosopher" class="node-philosopher"></p>
                    <div id="node-description" class="node-description"></div>
                </div>
            </div>

            <!-- Graph container -->
            <div id="graph-container" class="graph-container">
                <div class="loading-message">Loading philosophy sphere...</div>
                
                <!-- Floating reset button -->
                <button id="reset-button" class="floating-reset-button" title="Reset View">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                        <path d="M3 21v-5h5"></path>
                    </svg>
                </button>
                
                <!-- Legend overlay (desktop only) -->
                <div class="legend-overlay">
                    <h3 class="legend-title" data-en="Legend" data-zh="图例">Legend</h3>
                    <div class="legend-items">
                        <div class="legend-item">
                            <span class="legend-color ideology-color" data-en="Ideology" data-zh="哲学流派">Ideology</span>
                            <span data-en="Major school" data-zh="主要学派">Major school</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color keyword-color" data-en="Concept" data-zh="概念">Concept</span>
                            <span data-en="Related idea" data-zh="相关思想">Related idea</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-line influence-line"></span>
                            <span data-en="Influence" data-zh="影响">Influence</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-line opposition-line"></span>
                            <span data-en="Opposition" data-zh="对立">Opposition</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile modal -->
        <div id="mobile-modal" class="mobile-modal hidden">
            <div class="mobile-modal-content">
                <button id="close-mobile-modal" class="close-modal-button">×</button>
                <div class="mobile-info-content">
                    <h3 id="mobile-node-title" class="node-title"></h3>
                    <p id="mobile-node-philosopher" class="node-philosopher"></p>
                    <div id="mobile-node-description" class="node-description"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be inserted by footer.js -->
    
    <!-- Main script -->
    <script src="philosophy-sphere-d3.js"></script>
</body>
</html>
